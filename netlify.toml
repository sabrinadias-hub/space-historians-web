# Deploy no Netlify: cada push na main publica uma nova versão.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Modelos 3D e arquivos gerados pelo Vite (com hash no nome) podem ficar em cache por muito tempo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
